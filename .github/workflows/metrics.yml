name: Metrics
on:
  schedule: [{cron: "0 0 * * 0"}]   # 每周日 00:00 UTC 刷新
  workflow_dispatch:                 # 允许手动触发
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"
      - "hack/translate.py"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 后续 post-process 步骤需要本地 git 仓库才能 pull / commit / push
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============ 主卡片：综合统计（960px 原生hero 宽度）============
      - name: 🧬 Main metrics card
        uses: lowlighter/metrics@latest
        timeout-minutes: 40
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: TMYTiMidlY
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Shanghai
          config_display: large           # 原生 960px（默认 480px 未缩放不模糊）
          config_padding: 0, 8 + 12%

          # 语言分布（GitHub Linguist 统计版，不 clone repo）
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, jupyter notebook, makefile, dockerfile,
            shell, batchfile, powershell, vim script
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # 🚫 plugin_lines 移除：上游 bug。它的 indepth 分析会在某些
          # repo owner=null（账号已注销）时报 TypeError: Cannot read 'login'
          # of null，导致整个主卡 step 崩溃。等上游修后再加回。

          # 🚫 plugin_stargazers 移除：当 star 数偏少时（个位~百位），
          # 累计曲线几乎是一条平线，两张全宽图各占一大段版面但信息量极低；
          # 等仓库星数显著上来后再考虑加回。

          # 🚫 主卡内嵌 plugin_followup(repositories) 移除：
          # 该区块塞在右栏占了主卡近一半高度，且语义与下方独立的
          # "🌟 对外贡献 · 我创建的 Issue / PR" section 高度重叠
          # （都聚焦在 issue/PR 状态），删掉让主卡两栏均衡 + 去掉重复。

          # 关注者
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 24
          plugin_people_size: 28

      # ============ 3D 等距贡献日历（全年 365 天）============
      - name: 📅 Isocalendar (full year)
        uses: lowlighter/metrics@latest
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.isocalendar.svg
          user: TMYTiMidlY
          base: ""
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 🚫 Coding habits step 移除：上游 bug（lowlighter/metrics#1739/#1777/#1778/#1807）
      # habits plugin filter commits 时踩到 commit.author=undefined（提交者已注销）
      # 报 TypeError: Cannot destructure 'author' of 'undefined'，输出 4KB 空图。
      # 上游多个 fix PR 都未被 merge，同 Achievements 一并处理。

      # ============ Notable contributions（对外部仓库的贡献，含 org + 个人 repo）============
      - name: 🌟 Notable contributions
        uses: lowlighter/metrics@latest
        timeout-minutes: 15
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.notable.svg
          user: TMYTiMidlY
          base: ""
          config_timezone: Asia/Shanghai
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_repositories: yes
          plugin_notable_self: no

      # ============ Followup（我自己创建的 issue / PR 比例 + indepth）============
      - name: 📨 Followup (issues / PRs I opened)
        uses: lowlighter/metrics@latest
        timeout-minutes: 10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.followup.svg
          user: TMYTiMidlY
          base: ""
          config_timezone: Asia/Shanghai
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes

      # ============ 🇨🇳 Hack：把 SVG 文本翻译为中文 ============
      # lowlighter/metrics 无 i18n 系统，所有 plugin 标题硬编码英文。
      # 这一步在 metrics action 跑完（它通过 octokit API 已经把英文 SVG
      # commit 到 remote）之后，pull 下来用正则替换文本再 commit 一次。
      # if: always() 保证即使部分 metrics step 失败，已生成的 SVG 仍翻译。
      - name: 🇨🇳 Translate SVGs to Chinese
        if: always()
        run: |
          set -eu
          # metrics 通过 REST API commit，本地 workspace 没更新，先拉最新
          git fetch origin main
          git reset --hard origin/main

          python3 hack/translate.py

          if [[ -z "$(git status --porcelain metrics*.svg 2>/dev/null)" ]]; then
            echo "no SVG changes after translation"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics*.svg
          git commit -m "i18n: 翻译 metrics SVG 文本为中文 [skip ci]"
          git push origin main
