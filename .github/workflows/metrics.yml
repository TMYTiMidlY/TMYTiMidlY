name: Metrics
on:
  schedule: [{cron: "0 0 * * 0"}]   # 每周日 00:00 UTC 刷新
  workflow_dispatch:                 # 允许手动触发
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============ 主卡片：综合统计 ============
      - name: 🧬 Main metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: TMYTiMidlY
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Shanghai
          config_padding: 0, 8 + 12%

          # 语言分布
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, jupyter notebook, makefile, dockerfile,
            shell, batchfile, powershell, vim script
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30

          # 代码行数
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

          # PR / Issue 跟进
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes

          # Stars 增长
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph

          # 关注者 / sponsors
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 24
          plugin_people_size: 28

      # ============ 3D 等距贡献日历（全年 365 天）============
      - name: 📅 Isocalendar (full year)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.isocalendar.svg
          user: TMYTiMidlY
          base: ""
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ============ Coding habits（工作时段 / 提交习惯）============
      - name: 🧠 Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.habits.svg
          user: TMYTiMidlY
          base: ""
          config_timezone: Asia/Shanghai
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # ============ Notable contributions（对外部仓库的贡献）============
      # 这块就是你之前想看的"给别人提的 PR/issue/commit"按 repo 聚合
      - name: 🌟 Notable contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.notable.svg
          user: TMYTiMidlY
          base: ""
          config_timezone: Asia/Shanghai
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_repositories: yes
          plugin_notable_self: no

      # ============ GitHub Achievements ============
      - name: 🏆 Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.plugin.achievements.svg
          user: TMYTiMidlY
          base: ""
          config_timezone: Asia/Shanghai
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0
